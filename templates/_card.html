<div class="col"><article class="card p h-100 border-0"><div class="im">{% if p.kind=='combo' %}<span class="combo-tag">Combo</span>{% endif %}<img src="{{ url_for('static', filename='img/'+p.img) }}" alt="{{ p.name }}" loading="lazy">
{% if p.img2 %}<img src="{{ url_for('static', filename='img/'+p.img2) }}" alt="" loading="lazy">{% endif %}
<button type="button" class="zoom-btn" data-bs-toggle="modal" data-bs-target="#zoomModal" data-img="{{ url_for('static', filename='img/'+p.img) }}" data-name="{{ p.name }}" aria-label="Zoom in on {{ p.name }}">
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg></button></div>
<div class="card-body d-flex flex-column"><h3 class="h5">{{ p.name }}</h3><small class="text-body-secondary">{{ p.desc }}</small>
<form class="mt-auto pt-3 d-flex justify-content-between align-items-center" method="post" action="{{ url_for('cart_add', pid=k) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="price">{{ (p|price)|money }}</span><button class="btn btn-dark rounded-pill fw-bold">Add to cart</button></form></div></article></div>
